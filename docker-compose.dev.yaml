services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: development
    container_name: api_server
    ports:
      - "3001:3000"
    env_file:
      - ".env"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18-alpine
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    ports:
     - "6379:6379"

volumes:
  postgres_dev_data:
  